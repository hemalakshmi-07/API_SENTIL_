AWSTemplateFormatVersion: "2010-09-09"
Description: >
  API Sentinel monitoring - email alert when the compare Lambda has errors,
  plus a monthly cost budget alert.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives alerts
  LambdaFunctionName:
    Type: String
    Description: Name of the spec-comparison Lambda function
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    Description: Monthly cost budget in USD

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: api-sentinel-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ALERT: 5 or more Lambda errors within 5 minutes -> email
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: api-sentinel-lambda-errors
      AlarmDescription: Compare Lambda returned 5+ errors in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Keep logs for 14 days only (cost control)
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      RetentionInDays: 14

  # COST: email at 80% of budget
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: api-sentinel-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
